<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>완강 체크</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#252821;--muted:#777b72;--line:#e7e6df;--green:#476b52;--pale:#eaf1e8;--red:#b74a42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.45}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:var(--green);color:white;cursor:pointer}button.secondary{background:#efefe9;color:var(--ink)}button.danger{background:#fae9e7;color:var(--red)}button.small{padding:6px 9px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.head h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}.section{margin:18px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.section-title h2{font-size:17px;margin:0}.cards{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}.dday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:145px;flex:0 0 auto}.dday strong{font-size:23px;display:block;color:var(--green)}.dday .event{font-weight:650;overflow-wrap:anywhere}.dday small{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.between{justify-content:space-between}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:13px}.subject{border-left:4px solid #9ab39a}.subject-name{font-weight:750;font-size:18px}.category{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.category-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.category-name{font-weight:700}.progress{height:6px;background:#edeee8;border-radius:9px;overflow:hidden;margin:8px 0}.progress span{height:100%;display:block;background:#769778}.lecture{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid #f0f0eb}.lecture input{margin-top:4px;width:18px;height:18px;accent-color:var(--green)}.lecture label{flex:1;min-width:0}.done{text-decoration:line-through;color:#898d84}.date{font-size:12px;color:var(--muted);display:block}.field{width:100%;border:1px solid #dcded5;background:white;border-radius:10px;padding:10px;color:var(--ink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid .full{grid-column:1/-1}.hidden{display:none!important}.empty{color:var(--muted);text-align:center;padding:22px 8px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{background:#eaece5;color:#333}.tabs button.active{background:var(--green);color:white}.daygroup{margin:12px 0}.daygroup h3{font-size:14px;margin:0 0 7px}.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;padding:10px;z-index:5}.dialog{background:var(--bg);width:min(100%,560px);max-height:90dvh;overflow:auto;border-radius:18px;padding:17px}.dialog h2{margin:0 0 13px;font-size:19px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.tiny{font-size:12px}@media(min-width:600px){.modal{align-items:center}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
<header class="head"><div><h1>완강 체크 <span aria-hidden="true">✓</span></h1><div class="sub">내 페이스대로, 한 강씩</div></div><button class="secondary small" id="backupBtn">백업/복원</button></header>
<section class="section"><div class="section-title"><h2>📌 D-day</h2><button class="small" id="addDday">+ 일정 추가</button></div><div class="cards" id="ddays"></div></section>
<section class="section"><div class="section-title"><h2>📚 과목별 강의</h2><button class="small" id="addSubject">+ 과목 추가</button></div><div id="subjects"></div></section>
<section class="section"><div class="section-title"><h2>🗓️ 완강 기록</h2></div><div class="panel"><div class="tabs" id="historyTabs"><button class="active" data-view="recent">최근 기록</button><button data-view="calendar">날짜별 보기</button></div><div id="history" style="margin-top:12px"></div></div></section>
<div class="foot">이 기기의 브라우저에 자동 저장됩니다. 다른 기기로 옮길 땐 백업 파일을 이용하세요.</div>
</div>
<div class="modal hidden" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button class="secondary" id="cancelModal">취소</button><button id="saveModal">저장</button></div></div></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<script>
const KEY='wanGangCheck_v1';
const defaults=[
 {id:'s1',name:'국어',categories:[{id:'c1',name:'문법',lectures:[]},{id:'c2',name:'문학',lectures:[]},{id:'c3',name:'비문학',lectures:[]}]},
 {id:'s2',name:'영어',categories:[{id:'c4',name:'문법',lectures:[]},{id:'c5',name:'구문',lectures:[]},{id:'c6',name:'독해',lectures:[]}]},
 {id:'s3',name:'행정학',categories:[{id:'c7',name:'기본이론',lectures:[]}]},
 {id:'s4',name:'행정법',categories:[{id:'c8',name:'기본이론',lectures:[]}]}
];
let state=load(), historyView='recent', modalSave=null;
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.subjects)&&Array.isArray(x.ddays))return x}catch(e){}return {subjects:structuredClone(defaults),ddays:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fmt(d){if(!d)return '';return d.replaceAll('-','.')}
function diff(date){let a=new Date(today()+'T00:00:00'),b=new Date(date+'T00:00:00');return Math.round((b-a)/86400000)}
function dayLabel(n){return n>0?`D-${n}`:n===0?'D-Day':`D+${Math.abs(n)}`}
function allLectures(){let a=[];state.subjects.forEach(s=>s.categories.forEach(c=>c.lectures.forEach(l=>a.push({...l,subject:s.name,category:c.name,subjectId:s.id,categoryId:c.id}))));return a}
function count(c){return {done:c.lectures.filter(l=>l.done).length,total:c.lectures.length}}
function renderDdays(){let el=document.getElementById('ddays');if(!state.ddays.length){el.innerHTML='<div class="panel muted">시험일이나 목표일을 추가해 보세요.</div>';return}el.innerHTML=state.ddays.map((d,i)=>`<div class="dday"><div class="row between"><span class="event">${esc(d.name)}</span><button class="secondary small" onclick="editDday('${d.id}')">⋯</button></div><strong>${dayLabel(diff(d.date))}</strong><small>${fmt(d.date)}</small><div class="row" style="margin-top:9px"><button class="secondary small" onclick="moveDday('${d.id}',-1)" ${i===0?'disabled':''}>←</button><button class="secondary small" onclick="moveDday('${d.id}',1)" ${i===state.ddays.length-1?'disabled':''}>→</button><button class="danger small" onclick="deleteDday('${d.id}')">삭제</button></div></div>`).join('')}
function renderSubjects(){let el=document.getElementById('subjects');if(!state.subjects.length){el.innerHTML='<div class="panel empty">과목을 추가해 주세요.</div>';return}el.innerHTML=state.subjects.map((s,si)=>{let total=s.categories.reduce((a,c)=>a+c.lectures.length,0),done=s.categories.reduce((a,c)=>a+count(c).done,0);return `<div class="panel subject"><div class="row between"><div class="grow"><div class="subject-name">${esc(s.name)}</div><div class="muted">${done}/${total}강 완료</div><div class="progress"><span style="width:${total?done/total*100:0}%"></span></div></div><div class="row"><button class="secondary small" onclick="editSubject('${s.id}')">수정</button><button class="secondary small" onclick="addCategory('${s.id}')">+ 분류</button><button class="danger small" onclick="deleteSubject('${s.id}')">삭제</button></div></div>${s.categories.map((c,ci)=>{let n=count(c);return `<div class="category"><div class="category-head"><div><span class="category-name">${esc(c.name)}</span> <span class="muted">${n.done}/${n.total}</span></div><div class="row"><button class="secondary small" onclick="editCategory('${s.id}','${c.id}')">수정</button><button class="secondary small" onclick="addLecture('${s.id}','${c.id}')">+ 강의</button><button class="danger small" onclick="deleteCategory('${s.id}','${c.id}')">삭제</button></div></div>${c.lectures.length?c.lectures.map(l=>`<div class="lecture"><input type="checkbox" id="${l.id}" ${l.done?'checked':''} onchange="toggleLecture('${s.id}','${c.id}','${l.id}',this.checked)"><label for="${l.id}" class="${l.done?'done':''}">${esc(l.name)}${l.done?`<span class="date">완료일 ${fmt(l.date||'')}</span>`:''}</label><button class="secondary small" onclick="editLecture('${s.id}','${c.id}','${l.id}')">수정</button><button class="danger small" onclick="deleteLecture('${s.id}','${c.id}','${l.id}')">×</button></div>`).join(''):'<div class="muted" style="padding:9px 0">등록된 강의가 없어요.</div>'}</div>`}).join('')}</div>`}).join('')}
function renderHistory(){let el=document.getElementById('history'),a=allLectures().filter(l=>l.done&&l.date).sort((x,y)=>y.date.localeCompare(x.date));if(historyView==='recent'){el.innerHTML=a.length?a.slice(0,30).map(l=>`<div class="lecture"><div class="grow">${esc(l.name)}<span class="date">${fmt(l.date)} · ${esc(l.subject)} / ${esc(l.category)}</span></div></div>`).join(''):'<div class="empty">아직 완강 기록이 없어요.</div>';return}let dates=[...new Set(a.map(l=>l.date))].sort((x,y)=>y.localeCompare(x));el.innerHTML=`<label class="muted">날짜 선택</label><select class="field" id="historyDate" style="margin:6px 0 12px">${dates.length?dates.map(d=>`<option value="${d}">${fmt(d)}</option>`).join(''):'<option value="">기록 없음</option>'}</select><div id="dayRecords"></div>`;showDay();document.getElementById('historyDate').onchange=showDay}
function showDay(){let sel=document.getElementById('historyDate'),out=document.getElementById('dayRecords');if(!sel||!out)return;let d=sel.value,items=allLectures().filter(l=>l.done&&l.date===d);out.innerHTML=items.length?items.map(l=>`<div class="lecture"><div>${esc(l.name)}<span class="date">${esc(l.subject)} / ${esc(l.category)}</span></div></div>`).join(''):'<div class="empty">이 날짜의 기록이 없어요.</div>'}
function render(){renderDdays();renderSubjects();renderHistory()}
function subject(id){return state.subjects.find(s=>s.id===id)}function category(sid,cid){return subject(sid)?.categories.find(c=>c.id===cid)}function lecture(sid,cid,lid){return category(sid,cid)?.lectures.find(l=>l.id===lid)}
function openModal(title,body,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modalSave=onSave;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');modalSave=null}
document.getElementById('cancelModal').onclick=closeModal;document.getElementById('saveModal').onclick=()=>{if(modalSave)modalSave();};
function field(label,id,value='',type='text'){return `<label class="muted" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(value)}" required>`}
function addSubject(){openModal('과목 추가',field('과목명','name'),()=>{let n=document.getElementById('name').value.trim();if(!n)return;state.subjects.push({id:uid(),name:n,categories:[]});persist();closeModal()})}
function editSubject(id){let s=subject(id);openModal('과목 수정',field('과목명','name',s.name),()=>{let n=document.getElementById('name').value.trim();if(!n)return;s.name=n;persist();closeModal()})}
function deleteSubject(id){if(confirm('이 과목과 안의 모든 강의를 삭제할까요?')){state.subjects=state.subjects.filter(s=>s.id!==id);persist()}}
function addCategory(sid){openModal('분류 추가',field('분류명 (예: 문법, 문학)','name'),()=>{let n=document.getElementById('name').value.trim();if(!n)return;subject(sid).categories.push({id:uid(),name:n,lectures:[]});persist();closeModal()})}
function editCategory(sid,cid){let c=category(sid,cid);openModal('분류 수정',field('분류명','name',c.name),()=>{let n=document.getElementById('name').value.trim();if(!n)return;c.name=n;persist();closeModal()})}
function deleteCategory(sid,cid){if(confirm('이 분류와 안의 모든 강의를 삭제할까요?')){let s=subject(sid);s.categories=s.categories.filter(c=>c.id!==cid);persist()}}
function addLecture(sid,cid){openModal('강의 추가',field('강의명 (예: 1강 OT)','name'),()=>{let n=document.getElementById('name').value.trim();if(!n)return;category(sid,cid).lectures.push({id:uid(),name:n,done:false,date:''});persist();closeModal()})}
function editLecture(sid,cid,lid){let l=lecture(sid,cid,lid);openModal('강의 수정',field('강의명','name',l.name),()=>{let n=document.getElementById('name').value.trim();if(!n)return;l.name=n;persist();closeModal()})}
function deleteLecture(sid,cid,lid){if(confirm('이 강의를 삭제할까요?')){let c=category(sid,cid);c.lectures=c.lectures.filter(l=>l.id!==lid);persist()}}
function toggleLecture(sid,cid,lid,checked){let l=lecture(sid,cid,lid);if(checked){openModal('완강 날짜 선택',field('완료한 날짜','date',today(),'date'),()=>{let d=document.getElementById('date').value;if(!d)return;l.done=true;l.date=d;persist();closeModal()});document.getElementById('date').value=l.date||today()}else{l.done=false;l.date='';persist()}}
function addDday(){openModal('D-day 일정 추가',field('일정 이름','name')+'<div style="height:8px"></div>'+field('날짜','date',today(),'date'),()=>{let n=document.getElementById('name').value.trim(),d=document.getElementById('date').value;if(!n||!d)return;state.ddays.push({id:uid(),name:n,date:d});persist();closeModal()})}
function editDday(id){let d=state.ddays.find(x=>x.id===id);openModal('D-day 수정',field('일정 이름','name',d.name)+'<div style="height:8px"></div>'+field('날짜','date',d.date,'date'),()=>{let n=document.getElementById('name').value.trim(),date=document.getElementById('date').value;if(!n||!date)return;d.name=n;d.date=date;persist();closeModal()})}
function deleteDday(id){if(confirm('이 일정을 삭제할까요?')){state.ddays=state.ddays.filter(d=>d.id!==id);persist()}}
function moveDday(id,dir){let i=state.ddays.findIndex(d=>d.id===id),j=i+dir;if(j<0||j>=state.ddays.length)return;[state.ddays[i],state.ddays[j]]=[state.ddays[j],state.ddays[i]];persist()}
document.getElementById('addSubject').onclick=addSubject;document.getElementById('addDday').onclick=addDday;
document.getElementById('historyTabs').onclick=e=>{let b=e.target.closest('button[data-view]');if(!b)return;historyView=b.dataset.view;document.querySelectorAll('#historyTabs button').forEach(x=>x.classList.toggle('active',x===b));renderHistory()};
document.getElementById('backupBtn').onclick=()=>openModal('백업 / 복원','<p>백업 파일을 저장해 두면 기기를 바꾸거나 데이터가 사라졌을 때 복원할 수 있어요.</p><div class="row"><button id="exportBtn">백업 파일 내보내기</button><button class="secondary" id="importBtn">백업 파일 가져오기</button></div><p class="muted tiny">가져오기는 현재 기록을 백업 파일 내용으로 교체합니다.</p>',()=>closeModal());
document.getElementById('modalBody').addEventListener('click',e=>{if(e.target.id==='exportBtn'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='완강체크-백업-'+today()+'.json';a.click();URL.revokeObjectURL(url)}if(e.target.id==='importBtn'){closeModal();document.getElementById('importFile').click()}});
document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.subjects)||!Array.isArray(x.ddays))throw Error();if(confirm('현재 데이터를 백업 파일의 데이터로 바꿀까요?')){state=x;persist();alert('복원했어요.')}}catch(err){alert('올바른 완강 체크 백업 파일이 아니에요.')}e.target.value=''};r.readAsText(f)};
render();
</script>
</body></html>
